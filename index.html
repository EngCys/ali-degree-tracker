<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ali's Degree Tracker</title><style>
:root{--navy:#10233d;--red:#e53935;--bg:#f4f7fb;--line:#dce3ec;--muted:#68758a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px Arial,sans-serif}button,input,select{font:inherit}header{position:sticky;top:0;z-index:4;background:#fffffff2;border-bottom:1px solid var(--line);padding:14px 5%;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:11px;align-items:center;font-weight:800}.logo{background:var(--red);color:white;padding:10px;border-radius:12px}.wrap{max-width:1250px;margin:auto;padding:30px 20px}h1{font-size:38px;margin:4px 0}.eyebrow{color:var(--red);font-size:12px;font-weight:800;letter-spacing:2px}.sub{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:end;gap:20px}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:white;border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px #10233d0b}.card{padding:19px}.card.red{background:var(--red);color:white;border-color:var(--red)}.label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8590a0;font-weight:800}.red .label{color:#ffd4d2}.num{font-size:31px;font-weight:900;margin:7px 0}.progress{padding:18px;margin-bottom:18px}.bar{height:11px;background:#edf1f6;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--red),#ff796f)}.tools{display:grid;grid-template-columns:1fr 180px 150px;gap:10px;padding:12px;margin-bottom:18px}.tools input,.tools select,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:white}.group{margin-bottom:14px;overflow:hidden}.group-head{padding:15px 18px;background:#f8fafc;border-bottom:1px solid #edf1f6}.group-head b{display:block}.group-head small{color:var(--muted)}.row{display:grid;grid-template-columns:110px 1fr 70px 110px 70px 70px;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid #eef1f5}.row:last-child{border-bottom:0}.code{font:700 12px monospace;color:var(--muted)}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.badge{width:max-content;border-radius:20px;padding:6px 9px;font-size:11px;font-weight:800}.completed{background:#e9f8ef;color:#178447}.in_progress{background:#eaf2ff;color:#2366bb}.planned{background:#eef1f5;color:#586579}.failed{background:#fff3dc;color:#a56500}.icon{border:0;background:#f1f4f8;border-radius:8px;padding:8px;cursor:pointer}dialog{border:0;border-radius:22px;box-shadow:0 25px 70px #10233d55;width:min(620px,94vw);padding:25px}dialog::backdrop{background:#10233d77}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px;font-weight:700}.wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}.row{grid-template-columns:80px 1fr 55px}.row>*:nth-child(4),.row>*:nth-child(5){display:block}.row>*:nth-child(6){grid-column:3}.top{align-items:start;flex-direction:column}h1{font-size:31px}}@media(max-width:480px){.stats{grid-template-columns:1fr}.form{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><div class="brand"><span class="logo">🎓</span><span>DegreeTrack<small style="display:block;color:#768297;font-weight:400">UESTC · Software Engineering</small></span></div><b>ALI SALAMI</b></header><main class="wrap"><div class="top"><div><div class="eyebrow">ACADEMIC PROGRESS</div><h1>My degree plan</h1><div class="sub">Update grades every semester. Your data stays in this browser.</div></div><div><button class="btn secondary" onclick="backup()">Export backup</button> <button class="btn primary" onclick="openForm()">＋ Add course</button></div></div><div class="stats" id="stats"></div><div class="panel progress"><div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:9px"><span>Graduation progress</span><span id="progressText"></span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="panel tools"><input id="search" placeholder="Search course or code" oninput="render()"><select id="status" onchange="render()"><option value="all">All statuses</option><option value="completed">Completed</option><option value="in_progress">In progress</option><option value="planned">Planned</option><option value="failed">Retake</option></select><select id="term" onchange="render()"></select></div><div id="list"></div></main>
<dialog id="modal"><form id="form"><input type="hidden" id="id"><h2 id="formTitle">Add course</h2><div class="form"><label class="field">Course code<input id="code" required></label><label class="field">Credits<input id="credits" type="number" step=".5" min="0" required></label><label class="field wide">Course name<input id="name" required></label><label class="field wide">Category<input id="category" required></label><label class="field">Status<select id="courseStatus"><option value="completed">Completed</option><option value="in_progress">In progress</option><option value="planned">Planned</option><option value="failed">Retake</option></select></label><label class="field">Grade<input id="grade" type="number" min="0" max="100" placeholder="Pending"></label><label class="field wide">Semester<input id="semester" placeholder="2026 Fall"></label></div><div class="actions"><button type="button" class="btn secondary" onclick="modal.close()">Cancel</button><button class="btn primary">Save course</button></div></form></dialog><input id="restore" type="file" accept="application/json" hidden>
<script>
const seed=[
["B2005110","Comprehensive Sports A","General Education · Physical Education",1,"completed",68,"Previous"],["M2003010","Ultimate Frisbee B","General Education · Physical Education",1,"completed",90,"Previous"],["B2023510","Football C","General Education · Physical Education",1,"completed",83,"Previous"],["R6900540","Intermediate Chinese I","General Education · Language Skills",4,"completed",60,"Previous"],["R6900640","Intermediate Chinese II","General Education · Language Skills",4,"completed",60,"Previous"],["R6900440","Advanced Chinese II","General Education · Language Skills",4,"planned",null,"Unassigned"],["R6900340","Advanced Chinese I","General Education · Language Skills",4,"in_progress",null,"2026 Fall"],["R6900230","Overview of China","General Education · Humanities",3,"completed",63,"Previous"],["M0400110","Chinese Thesis Writing","General Education · Humanities",1,"planned",null,"Unassigned"],["A6200810","Fundamentals of Professional Writing","General Education · Core",1,"in_progress",null,"2026 Fall"],["IntN6900210","Freshman Education","General Education · Freshman Seminar",1,"completed",88,"Previous"],["U0900210","Introduction to Computational Thinking","General Education · Freshman Seminar",1,"completed",78,"Previous"],["E0900330","Discrete Mathematics","Major Required · Math & Science",3,"failed",36,"Previous"],["D1100160","Calculus I","Major Required · Math & Science",6,"failed",42,"Previous"],["D1100540","Linear Algebra & Analytic Geometry I","Major Required · Math & Science",4,"failed",40,"Previous"],["D1213640","University Physics","Major Required · Math & Science",4,"failed",46,"Previous"],["D1100250","Calculus II","Major Required · Math & Science",5,"planned",null,"Unassigned"],["D1100735","Probability & Mathematical Statistics","Major Required · Math & Science",3.5,"completed",91,"Previous"],["G0903020","The Age of Artificial Intelligence","Major Required · Core",2,"completed",76,"Previous"],["R0908730","Fundamentals of Software Engineering","Major Required · Core",3,"in_progress",null,"2026 Fall"],["R0908330","Compiler Technology","Major Required · Core",3,"in_progress",null,"2026 Fall"],["R0908440","Computer Architecture","Major Required · Core",4,"in_progress",null,"2026 Fall"],["R0908530","Computer Network Systems","Major Required · Core",3,"completed",83,"Previous"],["R0908620","Database Principles & Applications","Major Required · Core",2,"completed",77,"Previous"],["R0909140","Operating Systems Principles & Practice","Major Required · Core",4,"completed",83,"Previous"],["P0900725","Programming & Algorithms I","Major Required · Core",2.5,"completed",92,"Previous"],["P0900630","Programming & Algorithms II","Major Required · Core",3,"completed",60,"Previous"],["R0909330","Embedded Systems Design","Major Elective",3,"completed",60,"Previous"],["G0902920","Artificial Intelligence","Major Elective",2,"in_progress",null,"2026 Fall"],["R0909030","Comprehensive Software Engineering Training","Major Elective",3,"in_progress",null,"2026 Fall"],["R0908935","Big Data Analysis & Intelligent Computing","Major Elective",3.5,"in_progress",null,"2026 Fall"],["G0915320","Software Security Design","Major Elective",2,"completed",92,"Previous"],["T0903820","Software Testing","Major Elective",2,"completed",78,"Previous"],["S0904012","Graduation Project","Concentrated Practice",12,"planned",null,"Unassigned"],["S0900520","Engineering Practice","Concentrated Practice",2,"planned",null,"Unassigned"],["K0913780","Research & Engineering Ability Training","Concentrated Practice",8,"planned",null,"Unassigned"],["I1208820","Nutrition & Health","Independent Elective",2,"completed",92,"Previous"]].map((x,i)=>({id:i+1,code:x[0],name:x[1],category:x[2],credits:x[3],status:x[4],grade:x[5],semester:x[6]}));
let courses=JSON.parse(localStorage.getItem('aliDegreeCourses')||'null')||seed;const $=id=>document.getElementById(id);const gp=n=>n>=90?4:n>=85?3.7:n>=82?3.3:n>=78?3:n>=75?2.7:n>=72?2.3:n>=68?2:n>=64?1.5:n>=60?1:0;const labels={completed:'Completed',in_progress:'In progress',planned:'Planned',failed:'Retake'};function save(){localStorage.setItem('aliDegreeCourses',JSON.stringify(courses));render()}function render(){let passed=courses.filter(c=>c.status==='completed'),earned=passed.reduce((a,c)=>a+c.credits,0),att=courses.filter(c=>c.grade!==null&&c.grade!==''),w=att.reduce((a,c)=>a+c.credits,0),g=w?att.reduce((a,c)=>a+gp(+c.grade)*c.credits,0)/w:0,current=courses.filter(c=>c.status==='in_progress').reduce((a,c)=>a+c.credits,0);$('stats').innerHTML=`<div class="card red"><div class="label">Credits earned</div><div class="num">${earned}</div><small>of 130 · ${Math.round(earned/130*100)}%</small></div><div class="card"><div class="label">Current GPA</div><div class="num">${g.toFixed(2)}</div><small>4.00 scale</small></div><div class="card"><div class="label">In progress</div><div class="num">${current}</div><small>credits this term</small></div><div class="card"><div class="label">Remaining</div><div class="num">${Math.max(0,130-earned)}</div><small>credits to graduate</small></div>`;$('progressText').textContent=`${earned} / 130 credits`;$('fill').style.width=Math.min(100,earned/130*100)+'%';let terms=['All semesters',...new Set(courses.map(c=>c.semester))],tv=$('term').value;$('term').innerHTML=terms.map(t=>`<option ${t===tv?'selected':''}>${t}</option>`).join('');let q=$('search').value.toLowerCase(),st=$('status').value,term=$('term').value||'All semesters';let f=courses.filter(c=>(st==='all'||c.status===st)&&(term==='All semesters'||c.semester===term)&&(`${c.code} ${c.name} ${c.category}`).toLowerCase().includes(q));let groups={};f.forEach(c=>(groups[c.category]??=[]).push(c));$('list').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([cat,items])=>`<section class="panel group"><div class="group-head"><b>${cat}</b><small>${items.length} courses · ${items.reduce((a,c)=>a+c.credits,0)} credits</small></div>${items.map(c=>`<div class="row"><div class="code">${c.code}</div><div><div class="name">${c.name}</div><div class="meta">${c.semester}</div></div><b>${c.credits} cr</b><span class="badge ${c.status}">${labels[c.status]}</span><b>${c.grade??'—'}</b><span><button class="icon" onclick="openForm(${c.id})">✎</button> <button class="icon" onclick="del(${c.id})">×</button></span></div>`).join('')}</section>`).join(''):'<div class="panel empty">No courses match your filters.</div>'}
function openForm(id){let c=id?courses.find(x=>x.id===id):{id:'',code:'',name:'',category:'Major Required · Core',credits:3,status:'planned',grade:'',semester:'Unassigned'};Object.keys(c).forEach(k=>$(k==='status'?'courseStatus':k)&&($(k==='status'?'courseStatus':k).value=c[k]??''));$('formTitle').textContent=id?'Edit course':'Add course';modal.showModal()}$('form').onsubmit=e=>{e.preventDefault();let c={id:+$('id').value||Date.now(),code:$('code').value,name:$('name').value,category:$('category').value,credits:+$('credits').value,status:$('courseStatus').value,grade:$('grade').value===''?null:+$('grade').value,semester:$('semester').value||'Unassigned'},i=courses.findIndex(x=>x.id===c.id);i<0?courses.push(c):courses[i]=c;modal.close();save()};function del(id){if(confirm('Delete this course?')){courses=courses.filter(c=>c.id!==id);save()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(courses,null,2)],{type:'application/json'}));a.download='ali-degree-backup.json';a.click()}render();
</script></body></html>
